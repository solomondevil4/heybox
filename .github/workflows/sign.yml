name: heybox-daily

# 每天 UTC 00:00 = 北京时间 08:00 自动签到
# 也可在 Actions 页面点 Run workflow 手动跑
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 防止上一次还没跑完又叠加一次
concurrency:
  group: heybox-daily
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keepalive 需要：重新 enable 工作流来重置 60 天计数器
  issues: write    # 可选：把日报写进 Issue 触发 GitHub 通知

jobs:
  sign:
    name: 签到 + 每日分享任务
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 1) 没配 secret 时脚本会「成功」但什么都没做，这里直接拦下来
      # 2) 多账号格式校验：每个账号必须同时包含 pkey= 和 x_xhh_tokenid=
      #    换行或 & 分隔均可，缺字段时明确指出是第几个账号
      - name: 检查 Cookie 是否配置且格式完整
        env:
          heybox_ck: ${{ secrets.HEYBOX_CK }}
        run: |
          if [ -z "$heybox_ck" ]; then
            echo "::error::缺少 secret HEYBOX_CK，请到 Settings - Secrets and variables - Actions 添加"
            exit 1
          fi

          normalized=$(printf '%s' "$heybox_ck" | tr '&' '\n')
          total=0
          bad=0
          while IFS= read -r raw; do
            acc=$(printf '%s' "$raw" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$acc" ]; then
              continue
            fi
            total=$((total + 1))
            has_pkey=0
            has_token=0
            case "$acc" in
              *pkey=*) has_pkey=1 ;;
            esac
            case "$acc" in
              *x_xhh_tokenid=*) has_token=1 ;;
            esac
            if [ "$has_pkey" -ne 1 ] || [ "$has_token" -ne 1 ]; then
              bad=$((bad + 1))
              echo "::error::第 ${total} 个账号格式不完整：需要同时包含 pkey= 和 x_xhh_tokenid=，请检查 secret heybox_ck"
            fi
          done <<< "$normalized"

          echo "检测到 ${total} 个账号，格式错误 ${bad} 个"
          if [ "$total" -eq 0 ] || [ "$bad" -gt 0 ]; then
            exit 1
          fi

      # heybox_sign.js 同时完成：签到 / 分享任意帖子 / 分享游戏详情 / 分享游戏评价
      # 并输出「当前总H币」和「任务汇总」
      #
      # 输出先落到 sign.raw，再脱敏成 sign.log 打印出来。
      # 这样公开仓库的 Actions 日志、Artifact、邮件、Issue 里都不会出现
      # 黑盒ID / IMEI（IMEI 是 pkey 的 md5 前 16 位，属于凭证派生值）。
      - name: 执行每日任务（输出已脱敏）
        id: attendance
        env:
          heybox_ck: ${{ secrets.HEYBOX_CK }}
        run: |
          rc=0
          node heybox_sign.js > sign.raw 2>&1 || rc=$?
          sed -E \
            -e 's/账号\[([0-9]+)\]\[[0-9]+\]/账号[\1]/g' \
            -e 's/(黑盒ID=)[0-9]+/\1***/g' \
            -e 's/(IMEI=)[0-9a-fA-F]+/\1***/g' \
            -e 's/(heybox_id=)[0-9]+/\1***/g' \
            sign.raw > sign.log
          cat sign.log
          rm -f sign.raw
          exit $rc

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "## 小黑盒每日任务"
            echo ""
            echo "| 项目 | 结果 |"
            echo "| --- | --- |"
            echo "| 触发方式 | \`${{ github.event_name }}\` |"
            echo "| 执行时间 | $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z') |"
            echo "| 作业状态 | \`${{ job.status }}\` |"
            echo ""
            echo '```text'
            cat sign.log 2>/dev/null || echo '无日志'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sign-log-${{ github.run_id }}
          path: sign.log
          retention-days: 7
          if-no-files-found: ignore

      # 通过 QQ 邮箱 SMTP 推送结果（成功 / 失败都发）
      # 不想要这个功能：删掉本步骤 + secrets 里的 QQ_EMAIL / QQ_SMTP_AUTH_CODE
      - name: QQ 邮箱通知
        if: always()
        continue-on-error: true
        env:
          QQ_USER: ${{ secrets.QQ_EMAIL }}
          QQ_PASS: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/notify_qq.py

      # 把每天的结果追加到一个固定 Issue，触发 GitHub 通知（邮件 / App 推送）
      # 不想要这个功能：删掉本步骤 + 顶部 permissions 里的 issues: write
      - name: 写入日报 Issue（触发通知）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ job.status }}
        run: |
          NUM=$(gh issue list --state open --search "小黑盒签到日报 in:title" \
                --json number --jq '.[0].number // empty')
          BODY=$(printf '**%s** · %s\n\n```text\n%s\n```' \
            "$([ "$STATUS" = success ] && echo '全部完成' || echo '有任务未完成')" \
            "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" \
            "$(tail -n 25 sign.log 2>/dev/null || echo '无日志')")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "小黑盒签到日报" --body "$BODY"
          fi

  # 公开仓库的 60 天不活跃停用规则，靠这个 job 每天重置计数器
  # 必须在 schedule 触发时执行，否则一旦被停用就再也跑不起来
  keepalive:
    name: 保活
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
